<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="boxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1E56" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF1E56" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxBody" x1="12" y1="24" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242738"/>
      <stop offset="45%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#080910"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="10" y1="18" x2="54" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32364C"/>
      <stop offset="60%" stop-color="#1A1C2C"/>
      <stop offset="100%" stop-color="#0D0E18"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#B87700"/>
    </linearGradient>
    <linearGradient id="ribbonRed" x1="20" y1="10" x2="44" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D79"/>
      <stop offset="50%" stop-color="#FF1E56"/>
      <stop offset="100%" stop-color="#B30030"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Ambient glow circle -->
  <circle cx="32" cy="36" r="26" fill="url(#boxGlow)"/>
  
  <!-- Box Base -->
  <rect x="14" y="27" width="36" height="29" rx="4" fill="url(#boxBody)" stroke="#FFD700" stroke-width="1.2" stroke-opacity="0.6" filter="url(#boxShadow)"/>
  
  <!-- Box Lid -->
  <rect x="11" y="20" width="42" height="9" rx="2.5" fill="url(#boxLid)" stroke="#FFD700" stroke-width="1.2" stroke-opacity="0.8"/>
  
  <!-- Vertical Gold Ribbon -->
  <rect x="29" y="27" width="6" height="29" fill="url(#ribbonGold)"/>
  <rect x="29" y="20" width="6" height="9" fill="url(#ribbonGold)"/>
  
  <!-- Horizontal Laser Ribbon -->
  <rect x="14" y="38" width="36" height="5" fill="url(#ribbonRed)"/>
  
  <!-- Deluxe Bow (Top) -->
  <!-- Left Loop -->
  <path d="M31 20 C24 10 16 12 18 17 C20 22 28 20 31 20 Z" fill="url(#ribbonRed)" stroke="#FFF9A6" stroke-width="0.8"/>
  <!-- Right Loop -->
  <path d="M33 20 C40 10 48 12 46 17 C44 22 36 20 33 20 Z" fill="url(#ribbonRed)" stroke="#FFF9A6" stroke-width="0.8"/>
  <!-- Center Knot -->
  <circle cx="32" cy="19" r="3.5" fill="url(#ribbonGold)" stroke="#FFF" stroke-width="0.6"/>
  
  <!-- Sparkles -->
  <path d="M49 14 L50.5 18 L54.5 19.5 L50.5 21 L49 25 L47.5 21 L43.5 19.5 L47.5 18 Z" fill="#FFF9A6" opacity="0.9"/>
  <circle cx="15" cy="16" r="1.5" fill="#FFD700"/>
</svg>

