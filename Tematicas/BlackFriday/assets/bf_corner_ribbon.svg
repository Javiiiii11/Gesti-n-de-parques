<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="bfRibbonGrad" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="35%" stop-color="#0A0B10"/>
      <stop offset="70%" stop-color="#1E0A12"/>
      <stop offset="100%" stop-color="#2D0B16"/>
    </linearGradient>
    <linearGradient id="bfGoldLine" x1="0" y1="140" x2="140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF1E56"/>
    </linearGradient>
    <filter id="bfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Triangular Banner Body across Corner -->
  <path d="M0 0 L140 0 L0 140 Z" fill="url(#bfRibbonGrad)"/>
  
  <!-- Outer Neon Gold Trim -->
  <path d="M0 140 L140 0" stroke="url(#bfGoldLine)" stroke-width="2.5" filter="url(#bfGlow)"/>
  <path d="M0 133 L133 0" stroke="#FFD700" stroke-width="1" stroke-dasharray="4 3" opacity="0.8"/>
  <path d="M0 126 L126 0" stroke="#FF1E56" stroke-width="0.8" opacity="0.6"/>

  <!-- Corner Tech Accent Lines -->
  <path d="M0 45 L45 0" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
  <path d="M0 80 L80 0" stroke="#FF1E56" stroke-width="1" opacity="0.3"/>

  <!-- Central Cyber Lightning Bolt & Tech Emblem (45 deg rotated) -->
  <g transform="translate(42, 42) rotate(45)">
    <!-- Small Diamond Backing -->
    <rect x="-14" y="-14" width="28" height="28" rx="5" fill="#090A0F" stroke="#FFD700" stroke-width="1.2" filter="url(#bfGlow)"/>
    <!-- Lightning Bolt -->
    <path d="M2 -10 L-7 1 L0 1 L-2 10 L7 -1 L0 -1 Z" fill="url(#bfGoldLine)" stroke="#FFF275" stroke-width="0.5"/>
  </g>

  <!-- Corner Pin Light -->
  <circle cx="6" cy="6" r="3" fill="#FFD700" filter="url(#bfGlow)"/>
  <circle cx="6" cy="6" r="1.5" fill="#FFFFFF"/>
</svg>
