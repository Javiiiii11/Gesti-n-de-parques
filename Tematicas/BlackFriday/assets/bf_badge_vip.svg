<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="vipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="12" y1="10" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2616"/>
      <stop offset="50%" stop-color="#14120A"/>
      <stop offset="100%" stop-color="#080703"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D48800"/>
    </linearGradient>
    <linearGradient id="redRuby" x1="20" y1="16" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#B8002D"/>
    </linearGradient>
  </defs>
  
  <circle cx="32" cy="32" r="26" fill="url(#vipGlow)"/>
  
  <!-- Outer Gold Shield / Crest -->
  <path d="M32 8 L48 14 V32 C48 43 41 51 32 56 C23 51 16 43 16 32 V14 L32 8 Z" fill="url(#shieldGrad)" stroke="url(#goldRim)" stroke-width="2"/>
  
  <!-- Inner Shield Trim -->
  <path d="M32 12 L44 17 V31 C44 40 38 47 32 51 C26 47 20 40 20 31 V17 L32 12 Z" stroke="url(#goldRim)" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
  
  <!-- VIP Crown -->
  <path d="M23 29 L26 21 L32 25 L38 21 L41 29 Z" fill="url(#goldRim)" stroke="#FFF9A6" stroke-width="0.6"/>
  <circle cx="26" cy="20" r="1.5" fill="url(#redRuby)"/>
  <circle cx="32" cy="24" r="1.8" fill="url(#redRuby)"/>
  <circle cx="38" cy="20" r="1.5" fill="url(#redRuby)"/>
  
  <!-- VIP Lettering -->
  <text x="32" y="41" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="10" font-weight="900" fill="url(#goldRim)" letter-spacing="1">VIP</text>
  
  <!-- Sparkle Stars -->
  <circle cx="14" cy="18" r="1.5" fill="#FFD700"/>
  <circle cx="50" cy="18" r="1.5" fill="#FFF9A6"/>
</svg>

