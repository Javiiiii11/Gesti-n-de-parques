<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="tagCornerGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0A00"/>
      <stop offset="40%" stop-color="#0D0600"/>
      <stop offset="100%" stop-color="#1F0500"/>
    </linearGradient>
    <linearGradient id="tagGoldLine" x1="0" y1="160" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="tagRedLine" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1E56"/>
      <stop offset="100%" stop-color="#C4003B"/>
    </linearGradient>
    <filter id="tagGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="tagSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Corner fill triangle -->
  <path d="M0 0 L160 0 L0 160 Z" fill="url(#tagCornerGrad)" opacity="0.92"/>

  <!-- Outer accent lines -->
  <path d="M0 160 L160 0" stroke="url(#tagGoldLine)" stroke-width="3" filter="url(#tagGlow)" opacity="0.9"/>
  <path d="M0 148 L148 0" stroke="#FFD700" stroke-width="1" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M0 135 L135 0" stroke="#FF1E56" stroke-width="1" opacity="0.5"/>
  <path d="M0 120 L120 0" stroke="#FFD700" stroke-width="0.6" opacity="0.3"/>

  <!-- Diagonal accent marks -->
  <path d="M0 50 L50 0" stroke="#FFD700" stroke-width="1.5" opacity="0.5" filter="url(#tagSoftGlow)"/>
  <path d="M0 90 L90 0" stroke="#FF1E56" stroke-width="1" opacity="0.35"/>

  <!-- Central BF badge -->
  <g transform="translate(38, 38) rotate(45)">
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#0A0600" stroke="#FFD700" stroke-width="1.5" filter="url(#tagGlow)"/>
    <!-- Lightning bolt -->
    <path d="M4 -13 L-9 2 L0 2 L-4 13 L9 -2 L0 -2 Z" fill="url(#tagGoldLine)" stroke="#FFF275" stroke-width="0.6" filter="url(#tagSoftGlow)"/>
  </g>

  <!-- Corner pin dot -->
  <circle cx="7" cy="7" r="4" fill="#FFD700" filter="url(#tagGlow)"/>
  <circle cx="7" cy="7" r="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- BF text along diagonal -->
  <text transform="translate(70, 22) rotate(45)" font-family="Arial Black, sans-serif" font-size="9" font-weight="900" fill="#FFD700" opacity="0.7" letter-spacing="1">BF</text>
</svg>

