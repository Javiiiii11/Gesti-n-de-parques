<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="bracketGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF1E56"/>
      <stop offset="100%" stop-color="#FF1E56" stop-opacity="0"/>
    </linearGradient>
    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Cyber Corner Lines (Zero obstruction) -->
  <path d="M0 4 H36 L44 12 H76" stroke="url(#bracketGrad)" stroke-width="2" stroke-linecap="round" filter="url(#bracketGlow)"/>
  <path d="M4 0 V36 L12 44 V76" stroke="url(#bracketGrad)" stroke-width="2" stroke-linecap="round" filter="url(#bracketGlow)"/>
  
  <!-- Digital Telemetry Dots -->
  <circle cx="8" cy="8" r="2.5" fill="#FFD700"/>
  <circle cx="20" cy="8" r="1.5" fill="#FF1E56" opacity="0.8"/>
  <circle cx="8" cy="20" r="1.5" fill="#FF1E56" opacity="0.8"/>
  <line x1="16" y1="4" x2="16" y2="10" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="4" y1="16" x2="10" y2="16" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
</svg>

