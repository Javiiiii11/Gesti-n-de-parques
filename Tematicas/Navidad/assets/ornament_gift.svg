<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="60%" stop-color="#023E8A" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#giftShadow)">
    <!-- Box Body -->
    <rect x="18" y="36" width="44" height="34" rx="4" fill="url(#boxGrad)" />

    <!-- Box Lid -->
    <rect x="15" y="27" width="50" height="11" rx="3" fill="#0096C7" />

    <!-- Vertical Gold Ribbon -->
    <rect x="36" y="27" width="8" height="43" fill="url(#ribbonGrad)" />

    <!-- Horizontal Gold Ribbon on Box Body -->
    <rect x="18" y="50" width="44" height="7" fill="url(#ribbonGrad)" />

    <!-- Big Festive Satin Bow on top -->
    <!-- Left Loop -->
    <path d="M40,27 C30,12 18,16 26,24 C32,30 38,27 40,27 Z" fill="url(#ribbonGrad)" />
    <!-- Right Loop -->
    <path d="M40,27 C50,12 62,16 54,24 C48,30 42,27 40,27 Z" fill="url(#ribbonGrad)" />
    <!-- Center Knot -->
    <circle cx="40" cy="27" r="4.5" fill="#FFE49E" />
    <!-- Ribbon Tails -->
    <path d="M38,29 Q32,38 30,44" stroke="url(#ribbonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M42,29 Q48,38 50,44" stroke="url(#ribbonGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
