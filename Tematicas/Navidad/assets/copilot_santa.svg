<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Copilot AI Vibrant Gradient -->
    <linearGradient id="cpRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="50%" stop-color="#50E6FF" />
      <stop offset="100%" stop-color="#00BCF2" />
    </linearGradient>
    <linearGradient id="cpRibbon2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB900" />
      <stop offset="50%" stop-color="#F25022" />
      <stop offset="100%" stop-color="#E81123" />
    </linearGradient>
    <!-- Santa Hat Gradient -->
    <linearGradient id="cHatRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B" />
      <stop offset="60%" stop-color="#E60026" />
      <stop offset="100%" stop-color="#800010" />
    </linearGradient>
    <linearGradient id="cWhiteFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="cpGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#50E6FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0078D4" stop-opacity="0" />
    </radialGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="55" r="38" fill="url(#cpGlow)" />

  <!-- Copilot Ribbon Symbol -->
  <g filter="url(#cShadow)">
    <!-- Base Ribbon Loop Left -->
    <path d="M30,68 C22,68 16,62 16,54 C16,42 28,38 38,48 C46,56 46,68 30,68 Z" fill="url(#cpRibbon1)" />
    <!-- Loop Right -->
    <path d="M70,68 C78,68 84,62 84,54 C84,42 72,38 62,48 C54,56 54,68 70,68 Z" fill="url(#cpRibbon2)" />
    <!-- Central Intersect Loop -->
    <path d="M38,48 C46,38 54,38 62,48 C56,56 44,56 38,48 Z" fill="#2563EB" opacity="0.8" />
  </g>

  <!-- Santa Hat Tilted atop the Copilot Symbol -->
  <g filter="url(#cShadow)" transform="rotate(-8 52 35)">
    <!-- Red Cone draped to the right -->
    <path d="M32,40 C34,20 54,12 68,16 C76,18 86,28 84,38 C75,34 45,34 32,40 Z" fill="url(#cHatRed)" />
    <!-- Fold Shadow -->
    <path d="M54,12 C62,18 68,26 62,34 C55,26 48,20 54,12 Z" fill="#60000C" opacity="0.35" />

    <!-- Fluffy White Trim -->
    <rect x="26" y="35" width="54" height="14" rx="7" fill="url(#cWhiteFur)" />
    <!-- Fluff mounds -->
    <circle cx="32" cy="42" r="6" fill="url(#cWhiteFur)" />
    <circle cx="44" cy="41" r="6.5" fill="url(#cWhiteFur)" />
    <circle cx="56" cy="42" r="6.5" fill="url(#cWhiteFur)" />
    <circle cx="68" cy="41" r="6" fill="url(#cWhiteFur)" />

    <!-- Pom-Pom on tip -->
    <circle cx="85" cy="38" r="8" fill="url(#cWhiteFur)" />
    <circle cx="83" cy="36" r="5" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Festive Golden Sparkles -->
  <polygon points="20,24 22,28 26,28 23,31 24,35 20,32 16,35 17,31 14,28 18,28" fill="#FFD166" />
  <circle cx="78" cy="72" r="2" fill="#FFD166" />
  <circle cx="85" cy="65" r="1.3" fill="#FFF" />
</svg>
