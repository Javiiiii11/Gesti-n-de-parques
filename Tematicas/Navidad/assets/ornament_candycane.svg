<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <filter id="ccShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#ccShadow)" transform="rotate(-15 40 40)">
    <!-- White Cane Base -->
    <path d="M28,68 L28,32 C28,16 48,16 48,32 L48,38" 
          stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Red Spiral Stripes -->
    <!-- Clip to cane shape -->
    <mask id="caneMask">
      <path d="M28,68 L28,32 C28,16 48,16 48,32 L48,38" 
            stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
    </mask>

    <g mask="url(#caneMask)" stroke="#E63946" stroke-width="6" stroke-linecap="butt">
      <line x1="16" y1="64" x2="40" y2="58" />
      <line x1="16" y1="50" x2="40" y2="44" />
      <line x1="16" y1="36" x2="40" y2="30" />
      <line x1="22" y1="22" x2="44" y2="16" />
      <line x1="36" y1="14" x2="56" y2="22" />
      <line x1="40" y1="30" x2="58" y2="38" />
    </g>

    <!-- Green Festive Ribbon Bow in center -->
    <ellipse cx="28" cy="40" rx="3.5" ry="3.5" fill="#2D6A4F" />
    <path d="M28,40 Q18,34 18,42 Q25,43 28,40" fill="#40916C" />
    <path d="M28,40 Q38,34 38,42 Q31,43 28,40" fill="#40916C" />
    <path d="M27,41 Q22,50 20,54" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" />
    <path d="M29,41 Q34,50 36,54" stroke="#2D6A4F" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
