<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="globeGlass" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6" />
    </radialGradient>
    <linearGradient id="baseWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="50%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Ornate Wood Base -->
  <path d="M22,78 L26,70 L74,70 L78,78 Z" fill="url(#baseWood)" />
  <rect x="20" y="78" width="60" height="12" rx="3" fill="#582F0E" />
  <rect x="32" y="81" width="36" height="6" rx="2" fill="url(#goldPlate)" />

  <!-- Inside Globe: Night Sky backdrop -->
  <circle cx="50" cy="45" r="32" fill="#0C1B33" />

  <!-- Snowy hill inside -->
  <path d="M21,56 Q36,46 50,52 Q64,58 79,56 A32,32 0 0,1 50,77 A32,32 0 0,1 21,56 Z" fill="#F0F9FF" />

  <!-- Little Snowman inside -->
  <!-- Bottom ball -->
  <circle cx="50" cy="52" r="8" fill="#FFFFFF" />
  <!-- Head -->
  <circle cx="50" cy="40" r="5.5" fill="#FFFFFF" />
  <!-- Top Hat -->
  <rect x="45" y="32" width="10" height="5" rx="1" fill="#1E293B" />
  <rect x="43" y="36" width="14" height="2" fill="#E11D48" />
  <!-- Scarf -->
  <path d="M46,44 Q50,47 54,44" stroke="#E11D48" stroke-width="2" stroke-linecap="round" />
  <!-- Carrot nose -->
  <polygon points="50,40 55,41 50,42" fill="#F97316" />

  <!-- Mini Christmas Tree beside snowman -->
  <polygon points="63,38 67,46 59,46" fill="#15803D" />
  <polygon points="63,44 69,54 57,54" fill="#166534" />
  <rect x="62" y="54" width="2" height="4" fill="#713F12" />
  <circle cx="63" cy="37" r="1.5" fill="#FBBF24" />

  <!-- Swirling Falling Snow inside -->
  <circle cx="36" cy="30" r="1.2" fill="#FFF" opacity="0.9" />
  <circle cx="62" cy="28" r="1.5" fill="#FFF" opacity="0.95" />
  <circle cx="44" cy="24" r="1.3" fill="#FFF" opacity="0.9" />
  <circle cx="32" cy="42" r="1" fill="#FFF" opacity="0.8" />
  <circle cx="68" cy="42" r="1.2" fill="#FFF" opacity="0.85" />
  <circle cx="48" cy="34" r="0.9" fill="#FFF" opacity="0.9" />

  <!-- Glass Dome Overlay -->
  <circle cx="50" cy="45" r="32" fill="url(#globeGlass)" />

  <!-- Curved Highlight of the Glass Reflection -->
  <path d="M26,30 A28,28 0 0,1 66,20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <circle cx="28" cy="33" r="1.5" fill="#FFF" opacity="0.8" />
</svg>
